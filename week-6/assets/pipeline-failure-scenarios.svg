<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#212529">Common Pipeline Failure Scenarios</text>

  <!-- Dividing lines -->
  <line x1="400" y1="60" x2="400" y2="580" stroke="#6c757d" stroke-width="2"/>
  <line x1="20" y1="320" x2="780" y2="320" stroke="#6c757d" stroke-width="2"/>

  <!-- Quadrant 1: Top Left - Data Source Issues -->
  <rect x="30" y="70" width="360" height="240" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="10"/>
  <text x="210" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#d32f2f">🔌 Data Source Issues</text>

  <text x="40" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Common Problems:</text>
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="12" fill="#555">• Source database becomes unavailable</text>
  <text x="40" y="155" font-family="Arial, sans-serif" font-size="12" fill="#555">• API rate limits exceeded</text>
  <text x="40" y="170" font-family="Arial, sans-serif" font-size="12" fill="#555">• File formats change unexpectedly</text>
  <text x="40" y="185" font-family="Arial, sans-serif" font-size="12" fill="#555">• Authentication credentials expire</text>

  <text x="40" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Impact:</text>
  <text x="40" y="230" font-family="Arial, sans-serif" font-size="12" fill="#555">Pipeline cannot start - no data to process</text>

  <text x="40" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Detection:</text>
  <text x="40" y="275" font-family="Arial, sans-serif" font-size="12" fill="#555">Connection timeouts, empty datasets</text>
  <text x="40" y="290" font-family="Arial, sans-serif" font-size="12" fill="#555">Zero record counts</text>

  <!-- Quadrant 2: Top Right - Transformation Errors -->
  <rect x="410" y="70" width="360" height="240" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="10"/>
  <text x="590" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f57c00">⚙️ Transformation Errors</text>

  <text x="420" y="120" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Common Problems:</text>
  <text x="420" y="140" font-family="Arial, sans-serif" font-size="12" fill="#555">• Bad data causes parsing failures</text>
  <text x="420" y="155" font-family="Arial, sans-serif" font-size="12" fill="#555">• Business rules need updates</text>
  <text x="420" y="170" font-family="Arial, sans-serif" font-size="12" fill="#555">• Memory or compute exhausted</text>
  <text x="420" y="185" font-family="Arial, sans-serif" font-size="12" fill="#555">• Code bugs in transformation logic</text>

  <text x="420" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Impact:</text>
  <text x="420" y="230" font-family="Arial, sans-serif" font-size="12" fill="#555">Partial processing, incorrect results</text>

  <text x="420" y="255" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Detection:</text>
  <text x="420" y="275" font-family="Arial, sans-serif" font-size="12" fill="#555">Exception logs, unexpected record counts</text>
  <text x="420" y="290" font-family="Arial, sans-serif" font-size="12" fill="#555">Processing time spikes</text>

  <!-- Quadrant 3: Bottom Left - Data Quality Problems -->
  <rect x="30" y="330" width="360" height="240" fill="#e8f5e8" stroke="#388e3c" stroke-width="2" rx="10"/>
  <text x="210" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#388e3c">📊 Data Quality Problems</text>

  <text x="40" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Common Problems:</text>
  <text x="40" y="400" font-family="Arial, sans-serif" font-size="12" fill="#555">• Missing required fields (nulls)</text>
  <text x="40" y="415" font-family="Arial, sans-serif" font-size="12" fill="#555">• Duplicate records</text>
  <text x="40" y="430" font-family="Arial, sans-serif" font-size="12" fill="#555">• Data outside expected ranges</text>
  <text x="40" y="445" font-family="Arial, sans-serif" font-size="12" fill="#555">• Schema changes upstream</text>

  <text x="40" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Impact:</text>
  <text x="40" y="490" font-family="Arial, sans-serif" font-size="12" fill="#555">Unreliable analysis, bad decisions</text>

  <text x="40" y="515" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Detection:</text>
  <text x="40" y="535" font-family="Arial, sans-serif" font-size="12" fill="#555">Data validation checks, quality scores</text>
  <text x="40" y="550" font-family="Arial, sans-serif" font-size="12" fill="#555">Statistical anomalies</text>

  <!-- Quadrant 4: Bottom Right - Infrastructure Issues -->
  <rect x="410" y="330" width="360" height="240" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="10"/>
  <text x="590" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1976d2">🏗️ Infrastructure Issues</text>

  <text x="420" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Common Problems:</text>
  <text x="420" y="400" font-family="Arial, sans-serif" font-size="12" fill="#555">• Network connectivity problems</text>
  <text x="420" y="415" font-family="Arial, sans-serif" font-size="12" fill="#555">• Storage space exhaustion</text>
  <text x="420" y="430" font-family="Arial, sans-serif" font-size="12" fill="#555">• Computing cluster failures</text>
  <text x="420" y="445" font-family="Arial, sans-serif" font-size="12" fill="#555">• Service outages (cloud provider)</text>

  <text x="420" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Impact:</text>
  <text x="420" y="490" font-family="Arial, sans-serif" font-size="12" fill="#555">Complete pipeline shutdown</text>

  <text x="420" y="515" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Detection:</text>
  <text x="420" y="535" font-family="Arial, sans-serif" font-size="12" fill="#555">System monitoring alerts, timeouts</text>
  <text x="420" y="550" font-family="Arial, sans-serif" font-size="12" fill="#555">Resource utilization spikes</text>
</svg>